<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>

    <!-- Grade badge gradient (green → teal) -->
    <linearGradient id="gradeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>

    <!-- Glow filter for the grade badge -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for rounded rectangle -->
    <clipPath id="cardClip">
      <rect width="420" height="120" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect width="420" height="120" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- Subtle border -->
  <rect width="420" height="120" rx="16" ry="16"
        fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="120" rx="2" fill="url(#gradeGrad)" clip-path="url(#cardClip)"/>

  <!-- Grade badge circle -->
  <circle cx="62" cy="60" r="36" fill="#0f172a" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>

  <!-- Grade letter A -->
  <text x="62" y="72"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="42" font-weight="900"
        fill="url(#gradeGrad)"
        text-anchor="middle"
        filter="url(#glow)">A</text>

  <!-- Divider line -->
  <line x1="112" y1="20" x2="112" y2="100" stroke="#334155" stroke-width="1"/>

  <!-- Main title -->
  <text x="130" y="46"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="26" font-weight="700"
        fill="#f8fafc"
        letter-spacing="-0.5">Report Card</text>

  <!-- Tagline -->
  <text x="130" y="68"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" font-weight="400"
        fill="#94a3b8"
        letter-spacing="0.2">Soroban Smart Contract Safety Registry</text>

  <!-- Bottom meta row -->
  <!-- Stellar dot -->
  <circle cx="131" cy="90" r="4" fill="#0ea5e9"/>
  <text x="140" y="94"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="11" fill="#64748b">Stellar Network</text>

  <!-- Separator dot -->
  <circle cx="220" cy="90" r="2" fill="#334155"/>

  <!-- is_safe() label -->
  <text x="228" y="94"
        font-family="'Courier New', monospace"
        font-size="11" fill="#0ea5e9">is_safe(contract_id)</text>

  <!-- Separator dot -->
  <circle cx="358" cy="90" r="2" fill="#334155"/>

  <!-- Apache label -->
  <text x="366" y="94"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="11" fill="#64748b">Apache-2.0</text>
</svg>

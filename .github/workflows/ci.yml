name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Soroban contract tests ─────────────────────────────────────────────────
  contract:
    name: Contract tests (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/report_card

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/report_card/target
          key: cargo-${{ hashFiles('contracts/report_card/Cargo.toml') }}
          restore-keys: cargo-

      - name: Run contract unit tests
        run: cargo test --features testutils

      - name: Check formatting
        run: cargo fmt --check

  # ── TypeScript build (engine + sdk) ───────────────────────────────────────
  typescript:
    name: TypeScript build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build engine
        run: npm run build --workspace=engine

      - name: Build SDK
        run: npm run build --workspace=sdk

  # ── Next.js dashboard build ───────────────────────────────────────────────
  dashboard:
    name: Dashboard build (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env.local
        run: |
          cp web/.env.local.example web/.env.local
        working-directory: .

      - name: Build dashboard
        run: npm run build --workspace=web
        env:
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_REGISTRY_CONTRACT_ID: ""
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
